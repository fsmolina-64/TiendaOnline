<div class="auth-split-container">
  <div class="auth-banner-panel">
    <div class="auth-banner-overlay"></div>
    <img src="/auth-banner.png" alt="FeliMarket Banner" class="auth-banner-img" />
  </div>

  <div class="auth-form-panel">
    <div class="auth-card">

      <div class="auth-card-header">
        <img src="/logo-smile.png" alt="FeliMarket Logo" class="auth-brand-logo-img" />
        <span class="auth-brand-name">FeliMarket</span>
        <p class="auth-brand-subtitle">Tu tienda online de confianza</p>
      </div>

      <div class="auth-tabs">
        <a routerLink="/auth/login" routerLinkActive="active" class="auth-tab">Iniciar Sesión</a>
        <a routerLink="/auth/register" routerLinkActive="active" class="auth-tab">Crear Cuenta</a>
      </div>

      @if (error) {
      <div class="error-msg">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ error }}</span>
      </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label>Email</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" formControlName="email" placeholder="tu@email.com" />
          </div>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" formControlName="password" placeholder="••••••••" />
          </div>
        </div>

        <button type="submit" [disabled]="form.invalid || loading" class="btn-submit">
          @if (loading) {
          <span class="spinner"></span> Ingresando...
          } @else {
          Ingresar
          }
        </button>
      </form>
    </div>
  </div>
</div>
